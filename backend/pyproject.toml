[project]
name = "claritygrid-backend"
version = "0.1.0"
description = "FastAPI backend for the ClarityGrid client prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "psycopg[binary]>=3.1.0",
  "psycopg-pool>=3.2.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
