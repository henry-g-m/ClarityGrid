# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: claritygrid
metadata:
  template: claritygrid@0.1.0

services:
  backend:
    project: ./backend
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

  frontend:
    project: ./ui_prototype
    language: js
    host: staticwebapp
    dist: dist
    hooks:
      # Vite inlines env vars into the built bundle at build time, so the
      # backend's URL (a Bicep output, exposed to hooks as $BACKEND_URL) has
      # to land in an .env file before `npm run build` runs.
      prebuild:
        shell: sh
        run: node write-build-env.mjs
